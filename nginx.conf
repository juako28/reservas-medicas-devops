user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # El registro de acceso omite IP, agente del navegador y argumentos de URL.
    log_format reducido '$time_iso8601 method=$request_method uri=$uri status=$status bytes=$body_bytes_sent seconds=$request_time';
    access_log /dev/stdout reducido;
    sendfile on;
    server_tokens off;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
